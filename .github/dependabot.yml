version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"

  # Maintain dependencies for @kitware/trame-rca-electron
  - package-ecosystem: "npm"
    directory: "/js-electron-lib"
    schedule:
      interval: "weekly"
