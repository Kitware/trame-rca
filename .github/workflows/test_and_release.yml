name: Test and Release

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Install and run pre-commit
      - run: |
          pip install pre-commit
          pre-commit install
          pre-commit run --all-files

  pytest:
    name: Pytest ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
        config:
          - { name: "Linux", os: ubuntu-latest }
          - { name: "MacOSX", os: macos-latest }
          - { name: "Windows", os: windows-latest }

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install OSMesa for Linux
        if: matrix.config.os == 'ubuntu-latest'
        run: |
          sudo apt update
          sudo apt install -y libosmesa6-dev
          echo "VTK_DEFAULT_OPENGL_WINDOW=vtkOSOpenGLRenderWindow" >> "$GITHUB_ENV"

      # PyTurboJPEG 2 needs libjpeg-turbo >= 3.0. Ubuntu's libturbojpeg is 2.x and,
      # if installed, is found first, so use the official package in /opt instead.
      - name: Install libjpeg-turbo for Linux
        if: matrix.config.os == 'ubuntu-latest'
        run: |
          curl -fsSL -o libjpeg-turbo.deb https://github.com/libjpeg-turbo/libjpeg-turbo/releases/download/3.2.0/libjpeg-turbo-official_3.2.0_amd64.deb
          echo "21297da4a4eb34ebefc54afca5d8dd86c0fdd6a9dfe49b1b962c5d1eeeafd8ec  libjpeg-turbo.deb" | sha256sum -c
          sudo apt install -y ./libjpeg-turbo.deb

      # GitHub's Windows runners have no GPU, so VTK needs software rendering.
      # Mesa dropped OSMesa in 25.1, so pin the last mesa-dist-win release that ships osmesa.dll.
      - name: Install OSMesa for Windows
        if: matrix.config.os == 'windows-latest'
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL -o mesa.7z https://github.com/pal1000/mesa-dist-win/releases/download/25.0.7/mesa3d-25.0.7-release-msvc.7z
          echo "e81be9e5990fabc5e528f544b1a2e2f37f70fe098822eb9c70555501f3621287  mesa.7z" | sha256sum -c
          7z x -y -omesa mesa.7z x64/osmesa.dll
          cygpath -w "$PWD/mesa/x64" >> "$GITHUB_PATH"
          echo "VTK_DEFAULT_OPENGL_WINDOW=vtkOSOpenGLRenderWindow" >> "$GITHUB_ENV"

      - name: Install libjpeg-turbo for macOS
        if: matrix.config.os == 'macos-latest'
        run: brew install jpeg-turbo

      - name: Set Up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install JS Components
        run: |
          cd js-components
          npm i

      - name: Build Vue Components
        run: |
          cd vue-components
          npm i
          npm run build

      - name: Build React Components
        run: |
          cd react-components
          npm i
          npm run build

      - name: Install and Run Tests
        run: |
          pip install ".[turbo, avif, vtkstreaming, dev]"
          # Fail instead of silently testing the Pillow fallback as turbo-jpeg
          if [ "${{ matrix.config.os }}" != "windows-latest" ]; then
            python -c "from trame_rca.encoders.image_encoder import encode_pil, encode_turbo; assert encode_turbo is not encode_pil, 'turbo-jpeg fell back to Pillow'"
            python -c "from trame_rca.encoders.turbo_jpeg import jpeg; print('turbo-jpeg uses', jpeg._TurboJPEG__find_turbojpeg())"
          fi
          # Install requirements for playwright
          playwright install
          pytest -s ./tests --benchmark-json=benchmark.json
        env:
          CI: true

      - name: Upload benchmark results
        if: matrix.config.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-linux
          path: benchmark.json

  vitest:
    name: Vitest (JS Core Unit Tests)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set Up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Dependencies
        run: |
          cd js-components
          npm install

      - name: Run Vitest
        run: |
          cd js-components
          npm run test

      - name: Run ESLint
        run: |
          cd js-components
          npm run lint

  js-electron-lib:
    name: Test js-electron-lib
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set Up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Test and lint
        run: |
          cd js-electron-lib
          npm ci
          npm test
          npm run lint
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

  test-npm-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set Up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install JS Components
        run: |
          cd js-components
          npm i

      - name: Build Vue Components
        run: |
          cd vue-components
          npm i
          npm run build

      - name: Build React Components
        run: |
          cd react-components
          npm i
          npm run build

  release:
    needs: [pre-commit, pytest, vitest, js-electron-lib, test-npm-build]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    environment:
      name: pypi
      url: https://pypi.org/p/trame-rca
    permissions:
      id-token: write # IMPORTANT: mandatory for trusted publishing
      contents: write # IMPORTANT: mandatory for making GitHub Releases

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set Up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install JS Components
        run: |
          cd js-components
          npm i

      - name: Build Vue Components
        run: |
          cd vue-components
          npm i
          npm run build

      - name: Build React Components
        run: |
          cd react-components
          npm i
          npm run build

      - name: Python Semantic Release
        id: release
        uses: relekang/python-semantic-release@v10.7.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish package distributions to PyPI
        if: steps.release.outputs.released == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1

  # Publishes @kitware/trame-rca-electron when its package.json version is not on npm yet.
  # Uses npm trusted publishing (OIDC): no token needed once the package is configured on npmjs.com.
  publish-js-electron-lib:
    needs: [pre-commit, pytest, vitest, js-electron-lib, test-npm-build]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    environment:
      name: npm
      url: https://www.npmjs.com/package/@kitware/trame-rca-electron
    permissions:
      id-token: write # IMPORTANT: mandatory for npm trusted publishing and provenance
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set Up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1, which Node's bundled npm may be older than.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Publish if version is new
        working-directory: js-electron-lib
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already published, skipping"
          else
            npm ci
            npm publish
          fi
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
